version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: polla-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polla_mundialista
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polla-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/polla_mundialista?schema=public
      - JWT_SECRET=super-secret-key-change-me-in-production
      - NEXTAUTH_SECRET=super-secret-key-change-me-in-production
      - PORT=3000
    depends_on:
      - db

volumes:
  postgres_data:
